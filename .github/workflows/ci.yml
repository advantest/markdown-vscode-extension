# Every branch is built and tested on Linux, macOS and Windows, against the language server markdown-ls whose
# version package.json pins, taken from GitHub Packages. The VSIX file built on Linux is kept as an artifact of
# the run, so that a prototype can be installed without building it; nothing is published.
#
# Graphviz comes from conda-forge in the same version on every system, as in the workflow of markdown-ls.
# Only the conda-forge channel is used, never Anaconda's defaults channel, whose use is subject to a fee.

name: Build and test

on:
  push:
    branches:
    - '**'
  pull_request:
    branches:
    - main
  workflow_dispatch:

env:
  GRAPHVIZ_VERSION: 11.0.0

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        os:  # see https://docs.github.com/en/actions/reference/runners/github-hosted-runners
        - ubuntu-latest
        - macos-26-intel
        - macos-latest # ARM
        - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read

    steps:
    - name: Check out
      uses: actions/checkout@v6

    - name: Set up Node.js 22
      uses: actions/setup-node@v7 # see https://github.com/actions/setup-node
      with:
        node-version: '22'
        cache: npm

    - name: Set up JDK 21
      uses: actions/setup-java@v5 # see https://github.com/actions/setup-java
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Install Graphviz from conda-forge
      id: graphviz
      uses: mamba-org/setup-micromamba@v3 # see https://github.com/mamba-org/setup-micromamba
      with:
        environment-name: graphviz
        create-args: graphviz=${{ env.GRAPHVIZ_VERSION }}
        condarc: |
          channels:
            - conda-forge
          channel_priority: strict
        cache-environment: true

    # PlantUML does not look for dot on the PATH; it takes the environment variable GRAPHVIZ_DOT.
    - name: Tell PlantUML where Graphviz is
      shell: bash
      env:
        ENV_PATH: ${{ steps.graphviz.outputs.environment-path }}
      run: |
        if [ "$RUNNER_OS" = Windows ]; then
          dot="$(cygpath -w "$ENV_PATH/Library/bin/dot.exe")"
        else
          dot="$ENV_PATH/bin/dot"
        fi
        "$dot" -V
        echo "GRAPHVIZ_DOT=$dot" >> "$GITHUB_ENV"

    # Maven puts the distribution into the local repository under its -SNAPSHOT name, a snapshot too,
    # where "npm run fetch-server" takes it from.
    - name: Fetch the language server
      shell: bash
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        version="$(node -p "require('./package.json').markdownSupport.defaultServer.version")"
        mvn -B -ntp -s .github/maven-settings.xml org.apache.maven.plugins:maven-dependency-plugin:3.11.0:get \
          -Dartifact="com.advantest.markdown:markdown-ls:$version:zip:distribution" -Dtransitive=false \
          -DremoteRepositories=github-packages-markdown-ls::default::https://maven.pkg.github.com/advantest/markdown-ls

    - name: Install the dependencies
      run: npm ci

    # The tests inside VS Code need a display, which xvfb provides on Linux.
    - name: Test
      shell: bash
      env:
        MARKDOWN_SUPPORT_TEST_JAVA_HOME: ${{ env.JAVA_HOME }}
      run: |
        npm run fetch-server
        if [ "$RUNNER_OS" = Linux ]; then
          xvfb-run -a npm test
        else
          npm test
        fi

    - name: Package the VSIX file
      run: npm run package

    - name: Keep the VSIX file
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v7
      with:
        name: vsix
        path: '*.vsix'
        if-no-files-found: error
